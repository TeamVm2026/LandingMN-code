name: CI

on:
  pull_request:
  push:
    branches: [main]

# ⛔ ПРАВА GITHUB_TOKEN ЗАДАЮТСЯ ЗДЕСЬ, А НЕ НАСТРОЙКОЙ РЕПОЗИТОРИЯ.
# Без этого блока токен получает права ПО УМОЛЧАНИЮ репозитория — набор,
# который меняется в панели GitHub мимо кода и мимо ревью. Нужен токен ровно
# одному шагу — `actions/checkout`, и ему хватает чтения.
# ⚠️ `actions/upload-artifact` работает через `ACTIONS_RUNTIME_TOKEN`, а не
# через GITHUB_TOKEN, поэтому `contents: read` его не задевает. Ни один шаг
# этого workflow GITHUB_TOKEN не использует (grep по
# `GITHUB_TOKEN|github\.token|gh (api|pr|release|run)` даёт ноль совпадений) —
# то есть блок не может сломать ничего, кроме будущего шага, которому прав не
# хватит. Лечение такого шага — точечный `permissions` на его уровне, а не
# откат этого блока.
# ⚠️ В deploy.yml permissions уже заданы на уровне ЗАДАНИЯ
# (`contents: read`, `deployments: write`) — тот блок не трогать.
permissions:
  contents: read

# ⛔ ОТМЕНА УСТАРЕВШИХ ПРОГОНОВ — ТОЛЬКО ДЛЯ PULL REQUEST, И ЭТО ГЛАВНОЕ В ЭТОМ
# БЛОКЕ. Прогон длинный (три локали Lighthouse, стенд саботажа, Playwright с
# двумя браузерами), и каждый новый коммит в ветку PR раньше добавлял ещё один
# параллельный прогон вместо замены прежнего.
# ⛔ ДЛЯ push В main ОТМЕНА ЗАПРЕЩЕНА: `deploy.yml` идёт по `workflow_run` и
# гейтится `conclusion == 'success'`. Отменённый прогон даёт conclusion
# `cancelled`, то есть выкладка коммита, который его вытеснил, не состоится
# вовсе, а прод молча останется на прежней версии. Группа поэтому включает
# `github.ref`, а отмена — только при событии pull_request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ⛔ ЕДИНСТВЕННОЕ ОБЪЯВЛЕНИЕ АДРЕСА И КОНТАКТОВ СБОРКИ В CI.
#
# До ревью Фазы 3 эти три переменные были вписаны ЛИТЕРАЛАМИ в пять отдельных
# шагов, и `PUBLIC_SITE_URL` был равен `https://ci-preview.example.pages.dev`.
# Этот адрес подходит под `PREVIEW_HOST_PATTERN` в scripts/check-placeholders.ts
# и scripts/check-analytics-config.ts, а оба гейта вооружаются сами: они валят
# сборку ТОЛЬКО когда домен боевой. То есть режим был навсегда закреплён как
# «превью» — включая тот коммит, которым боевой домен будет привязан. Прежний
# комментарий здесь утверждал ровно обратное («без env гейт не мог упасть
# НИКОГДА»); правка, которую он описывал, заменила «всегда пусто ⇒ превью» на
# «всегда превью-адрес ⇒ превью». Наблюдаемое поведение не изменилось.
#
# Теперь адрес приходит из переменной репозитория и совпадает с тем, что
# использует deploy.yml. В день, когда `vars.PUBLIC_SITE_URL` будет переключён
# на боевой домен, оба гейта начнут валить CI по-настоящему — без правки
# workflow и без того, чтобы об этом кто-то помнил.
#
# ⚠️ Самовооружение не отменяет правила «гейт, ни разу не упавший, не считается
# работающим»: боевая ветка ОБОИХ гейтов доказывается на каждом прогоне
# саботажным стендом (scripts/sabotage/placeholders.ts и
# scripts/sabotage/analytics-config.ts), который подсовывает им боевой домен на
# копиях артефактов. Зелёный CI на превью-адресе больше не означает
# непроверенную боевую ветку.
env:
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://landingmn.pages.dev' }}
  # Объявлены в env.schema → обязательны для сборки. В CI нет .env.local.
  PUBLIC_MESSENGER_URL: ${{ vars.PUBLIC_MESSENGER_URL || 'https://m.me/PLACEHOLDER_FB_PAGE' }}
  PUBLIC_TG_CONTACT_URL: ${{ vars.PUBLIC_TG_CONTACT_URL || 'https://t.me/Example_Manager' }}
  # Адрес бота и идентификаторы аналитики: пустая строка — ШТАТНОЕ состояние
  # «ещё не выдан» (см. astro.config.mjs env.schema). Объявлены здесь, а не
  # опущены, чтобы CI собирал ровно ту конфигурацию, что и deploy.yml.
  PUBLIC_TG_BOT_URL: ${{ vars.PUBLIC_TG_BOT_URL }}
  PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
  PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
  # Sitekey виджета Turnstile (SEC-01) — ТЕСТОВЫЙ КЛЮЧ CLOUDFLARE, А НЕ БОЕВОЙ.
  #
  # ⚠️ ЭТО ЕДИНСТВЕННОЕ МЕСТО, ГДЕ env CI СОЗНАТЕЛЬНО РАСХОДИТСЯ С deploy.yml,
  # и расхождение здесь не послабление, а условие осмысленности прогона.
  # Боевой sitekey авторизован ровно на двух доменах — landingmn.pages.dev и
  # partner-melbet.com. Раннер GitHub ходит по `localhost`, которого в этом
  # списке нет и быть не должно, поэтому челлендж-платформа отвечает ему 400
  # (код виджета 110200). Замерено прогоном CI #82 при боевом ключе:
  #   • tests/analytics.spec.ts:654 — консольная ошибка с challenges.cloudflare.com
  #     засчитывалась как НАША: 4 failed;
  #   • tests/lead-submit.spec.ts:795 (×3 локали) — коробка ошибки виджета
  #     удлиняет форму, кнопка уезжает вниз, в кадр попадает подвал, и липкая
  #     панель штатно гаснет — падала ПРЕДПОСЫЛКА теста, а не его предмет;
  #   • все 7 тестов tests/lead-turnstile.spec.ts пропускались по предикату
  #     годности ключа — то есть виджет не проверялся вообще ничем.
  #
  # ⛔ Чинить это добавлением `localhost` в домены боевого виджета НЕЛЬЗЯ:
  # это ослабление БОЕВОЙ конфигурации ради зелёного CI (запрет — план 05-07,
  # docs/ops.md §6). Тестовый ключ решает ту же задачу, ничего не ослабляя.
  #
  # Что это даёт: полный набор возвращается к состоянию, в котором он ИЗМЕРЕН
  # зелёным (план 05-07: 208 passed / 2 skipped на сборке с `1x…AA`), а 7
  # тестов виджета из ПРОПУЩЕННЫХ становятся ИСПОЛНЯЕМЫМИ. Покрытие растёт.
  #
  # Почему это не нарушает правило «CI и deploy собирают одно и то же»:
  # артефакт, уезжающий в прод, собирает и проверяет сам deploy.yml — там
  # PUBLIC_TURNSTILE_SITEKEY по-прежнему `vars.PUBLIC_TURNSTILE_SITEKEY`, и
  # шаг «gates against the artifact that actually ships» осматривает именно
  # его. Обещание astro.config.mjs «включить виджет заполнением ОДНОЙ
  # переменной» тоже цело: переменная эта — та же самая, и живёт она в
  # deploy.yml.
  #
  # Ключ `1x00000000000000000000AA` — «always passes» из документации
  # Turnstile; ключи отказа (`2x…AB`) и принудительного челленджа (`3x…FF`)
  # подставляет сама сюита там, где ей нужна другая ветка.
  PUBLIC_TURNSTILE_SITEKEY: '1x00000000000000000000AA'

# ⛔ ЭКШЕНЫ ЗАКРЕПЛЕНЫ ПОЛНЫМ SHA, А НЕ ПЛАВАЮЩИМ ТЕГОМ (08.09.2026).
# Тег `v4` у всех четырёх экшенов лёгкий и указывает прямо на коммит — то есть
# владелец экшена (или тот, кто угнал его аккаунт) переставляет `v4` на любой
# коммит, и этот код исполняется в задании, которому доверен
# `CLOUDFLARE_API_TOKEN`. SHA этого не позволяет.
# ⛔ КОММЕНТАРИЙ С ВЕРСИЕЙ — НЕ УКРАШЕНИЕ: он единственное, по чему строку
# читает человек. Менять SHA и комментарий можно ТОЛЬКО ПАРОЙ, иначе следующий
# читатель поверит комментарию, а не коду.
# ⚠️ Закреплено РОВНО ТО, на что `v4` указывал в день захода. Поведение CI не
# меняется ни на шаг; обновление версий — отдельное решение, не этот заход.
jobs:
  verify:
    runs-on: ubuntu-latest
    # ⛔ ПОТОЛОК ВРЕМЕНИ. Без него зависший шаг держит раннер до умолчания
    # GitHub — ШЕСТЬ ЧАСОВ. В этом прогоне зависнуть есть чему: `check:sabotage`
    # поднимает настоящий рантайм Workers (порты 8788/8789), `check:lighthouse`
    # и Playwright поднимают предпросмотр, а осиротевший сервер на Windows
    # проект уже ловил. Шесть часов тишины неотличимы от работающего прогона.
    # ⚠️ 45 минут — потолок, а не ожидание: замер локального прогона Playwright
    # даёт около 21 минуты при двух воркерах, здесь воркер один, плюс сборка,
    # 27 гейтов, стенд саботажа и три локали Lighthouse. Если прогон начнёт
    # упираться в это число — это сигнал разбираться, а не поднимать потолок.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # --- Статические гейты: не требуют сборки, стоят секунды -------------
      # До 11.08.2026 в CI вызывались только четыре проверки из одиннадцати.
      # Остальные существовали, но срабатывали лишь когда о них вспоминали
      # руками — то есть не защищали ничего. Аудит состояния проекта нашёл
      # это как MAJOR: CLAUDE.md обещает «красный билд не деплоится в прод»,
      # а фактически ни один из этих гейтов деплой не останавливал.
      - name: i18n key completeness
        run: npm run check:i18n
      # Словари воркера бота живут ВНЕ src/i18n намеренно — почему, сказано в
      # шапке самого гейта: check:font сверяет с 228-символьным сабсетом КАЖДЫЙ
      # символ словарей сайта, а тексты бота гарнитурой проекта не набираются
      # вовсе. Отдельный набор — отдельный вызов, и он обязан стоять ЗДЕСЬ.
      #
      # ⛔ Без этой строки получился бы ровно тот дефект, который аудит
      # 11.08.2026 нашёл как MAJOR и который повторился с Lighthouse: гейт
      # существует, саботажный стенд доказывает, что он УМЕЕТ краснеть, — а на
      # настоящих словарях его в облаке не зовёт никто. Переводчик заказчика
      # удаляет reply.manager_button из трёх файлов разом (он правит все три,
      # потому что смысл должен совпасть), проверка полноты видит идеально
      # симметричные словари, CI зелёный — и бот перестаёт передавать
      # менеджеру, то есть перестаёт делать то единственное, ради чего
      # заказчик 22.08.2026 согласился, чтобы первым человека встречал бот.
      # Третий раз этот класс дефекта в проект не заводим.
      #
      # ⚠️ В deploy.yml шаг НЕ дублируется: там по решению самого файла
      # повторяются только проверки уровня АРТЕФАКТА, а словари — уровень
      # исходников, и коммит у обоих прогонов один.
      - name: bot i18n completeness (передача менеджеру не потеряна)
        run: npm run check:i18n:bot
      - name: font glyph coverage (Ө/Ү/₮ + все символы словарей)
        run: npm run check:font
      # Решения-запреты заказчика от 26.08.2026 (10-CONTEXT.md Д-02, Д-05,
      # Д-06). Место шага — рядом со словарными гейтами: он читает те же
      # src/i18n и workers/bot/i18n плюс исходники стилей, и собранной dist/
      # не касается вовсе.
      #
      # ⛔ ШАГ ЗАВЕДЁН В ТОМ ЖЕ ПЛАНЕ, ЧТО И САМ ГЕЙТ (10-06). Дефект «гейт
      # написан, саботаж доказывает, что он умеет краснеть, а в облаке его не
      # зовёт никто» повторялся в проекте ТРИЖДЫ: аудит 11.08.2026 (четыре
      # проверки из одиннадцати), затем Lighthouse, затем check:i18n:bot.
      # Четвёртого раза нет.
      #
      # ⚠️ Почему без него нельзя. Присланный заказчиком дизайн-пакет сам
      # подсказывает нарушение двух решений из трёх: в макете FAQ ответ про
      # выплаты напечатан со словом, которое заказчик запретил дважды, а в
      # каталоге пакета лежит чужая гарнитура. Правка, скопированная «как в
      # макете», приезжает как обычный PR, и остановить её больше нечем:
      # check:i18n сверяет полноту наборов ключей и к содержимому строк слеп.
      - name: решения заказчика (Д-02 шрифт, Д-05 криптовалюта, Д-06 ₮)
        run: npm run check:client-decisions
      - name: motion safety (нет пропажи контента без JS)
        run: npm run check:motion-safety
      - name: craft contract (UI-SPEC §14)
        run: npm run check:craft-contract
      # Контракт формы против API: имена полей и перечисления живут в разметке и
      # в src/lib/lead-contract.ts, и расходятся молча — форма отправляется,
      # функция отвечает, лид приходит без контакта. Гейт читает ИСХОДНИКИ
      # (src/, functions/) и dist/ не касается вовсе, поэтому его место здесь,
      # среди статических, а не после сборки.
      - name: lead contract (форма против API, TTL из контракта)
        run: npm run check:lead-contract
      # ESLint. Шаг заведён В ТОМ ЖЕ ПЛАНЕ, что и сам гейт, потому что гейт без
      # вызова в CI — повторяющийся дефект этого проекта: аудит 11.08.2026 нашёл
      # его как MAJOR (четыре проверки из одиннадцати не звал никто), затем он
      # повторился с Lighthouse, затем с check:i18n:bot. Четвёртого раза нет.
      #
      # Место шага — среди статических гейтов, ДО `npm run build`: линтер читает
      # исходники и собранной dist/ не касается вовсе. Способность падать
      # доказывается на каждом прогоне саботажем eslint-const-assign.
      - name: ESLint (INFRA-02)
        run: npm run lint
      - name: astro check
        run: npx astro check
      - name: tsc --noEmit
        run: npx tsc --noEmit

      # --- Сборка и всё, что можно проверить только по её результату ------
      - name: astro build (build-time env assertion doubles as smoke test)
        run: npm run build
      - name: performance budget (критический путь + 0 render-blocking JS)
        run: npm run check:perf
      # ⛔ Гейт безопасности масок. Стоит ПОСЛЕ сборки намеренно: он проверяет
      # СОБРАННЫЙ CSS, потому что правило может склеиться из нескольких мест, а
      # `var()` — приехать из токена. Разбор трёх запретов — в шапке скрипта.
      - name: mask safety (нет var() в mask-*, объявления парные, композит в списке)
        run: npm run check:mask-safety
      - name: hreflang
        run: npm run check:hreflang
      - name: SEO (title/description/OG/JSON-LD)
        run: npm run check:seo
      # Целостность ссылок. Шаг заведён В ТОМ ЖЕ ПЛАНЕ, что и сам гейт (Д-04
      # контекста Фазы 8): гейт без вызова в CI — повторяющийся дефект этого
      # проекта, найденный трижды (аудит 11.08.2026, затем Lighthouse, затем
      # check:i18n:bot). Четвёртого раза нет.
      #
      # Место шага — здесь, среди проверок уровня АРТЕФАКТА, рядом с hreflang и
      # SEO: предмет гейта — собранный dist/, а не исходники. До сборки он
      # осмотрел бы ноль документов — и, по правилу «пустой обход это падение»,
      # честно упал бы с маркером ОБХОД ПУСТ, а не соврал бы зелёным.
      #
      # ⛔ Сети гейт не трогает и внешние адреса не запрашивает: обоснование в
      # шапке scripts/check-links.ts и в docs/external-links.md. Красный CI
      # здесь всегда означает НАШУ поломку, а не чужой аптайм.
      - name: broken links (INFRA-02)
        run: npm run check:links
      # Политика безопасности содержимого (INFRA-04). Шаг заведён В ТОМ ЖЕ ПЛАНЕ,
      # что и сам гейт: гейт без вызова в CI — повторяющийся дефект этого проекта,
      # найденный ТРИЖДЫ (аудит 11.08.2026, затем Lighthouse, затем check:i18n:bot).
      # Четвёртого раза нет — Д-04 контекста Фазы 8.
      #
      # Место шага — здесь, среди проверок уровня АРТЕФАКТА: предмет гейта — сам
      # заголовок в dist/_headers, который дописывает пост-сборочное звено
      # scripts/build-csp.ts (часть `npm run build`). До сборки он честно упал бы
      # с маркером «СБОРКИ НЕТ», а не соврал бы зелёным.
      #
      # ⚠️ ЗДЕСЬ ГЕЙТ ЦЕННЕЕ, ЧЕМ ЛОКАЛЬНО, И ЭТО НЕ РИТОРИКА. Набор внешних
      # хостов в сборке зависит от env: на машине разработчика
      # PUBLIC_TURNSTILE_SITEKEY/PUBLIC_GA_ID/PUBLIC_CLARITY_ID пусты, и ни
      # Turnstile, ни аналитики в dist/ нет ВОВСЕ. В CI они заданы. Гейт требует
      # присутствия каждого ОБЪЯВЛЕННОГО источника независимо от сборки — то
      # есть ловит политику, выведенную «не на той машине», ещё до деплоя.
      #
      # ⛔ Режим только отчётов. Включение enforce требует живого домена
      # (критерий 2, часть B) и ловится этим же гейтом, а не памятью.
      - name: content security policy (INFRA-04, режим отчётов)
        run: npm run check:csp
      # Гейт вооружается сам: валит сборку только когда PUBLIC_SITE_URL — боевой
      # домен, на превью лишь предупреждает. Переменная приходит из env всего
      # workflow (см. шапку файла), а не из литерала в этом шаге — литерал
      # `ci-preview.example.pages.dev` закреплял режим превью навсегда.
      # Способность падать доказывается саботажем placeholders-on-prod-domain.
      - name: contact placeholders (валит сборку только на боевом домене)
        run: npm run check:placeholders
      # BOM в JSON роняет шрифтовой гейт с невнятным SyntaxError, а в редакторе
      # его не видно. Windows PowerShell 5.1 расставляет его сам — на CI (Linux)
      # такого не случится, но правки сюда приезжают именно с Windows.
      - name: encoding (UTF-8 без BOM)
        run: npm run check:encoding
      # Проект трижды накапливал объявленные и никем не используемые токены;
      # находили их проверки вручную, а не инструменты. Теперь ловит гейт.
      - name: dead tokens
        run: npm run check:dead-tokens

      # Единицы высоты вьюпорта. `100dvh` на первом экране заставлял страницу
      # ездить под пальцем вслед за адресной строкой Android — заказчик описал
      # это как «подбивает под блоки и телепортирует». Тестом такое поймать
      # нельзя в принципе: в безголовом Chrome нет втягивающихся панелей, там
      # svh == dvh == lvh, и разницы Playwright не увидит. Поэтому гейт читает
      # исходники — обоснование целиком в шапке самого скрипта.
      - name: viewport units
        run: npm run check:viewport-units

      # --- гейты Фазы 3 (атрибуция и аналитика) -----------------------------
      # ⚠️ Их здесь не было, хотя все четыре существовали и проходили локально.
      # Это ровно та ложная зелень, на которой проект уже обжигался дважды:
      # Lighthouse тоже был «сделан», но не запускался в CI, а гейт заглушек
      # стоял в пайплайне и не мог упасть из-за отсутствия одной строки env.
      # Требование BOT-02 при этом дословно обещает, что «CI следит за
      # синхронностью» кодека — до этой правки не следил никто.

      # Кодек ?start=-меток. Главное здесь — золотые векторы: смена разделителя
      # проходит круговой тест и при этом ломает ВСЕ уже розданные рекламные
      # ссылки. Кодек — контракт трёх сред (сайт, будущий бот, будущий бэкенд),
      # и защищать его только на машине разработчика бессмысленно.
      - name: start-codec (золотые векторы + перебор домена)
        run: npm run check:start-codec

      # Двусторонняя синхронность: событие без документации и документ,
      # обещающий несуществующее событие, роняют сборку одинаково.
      - name: analytics events (код против документации)
        run: npm run check:analytics-events

      # Домен и ID приходят из env всего workflow (см. шапку файла). Пустой
      # PUBLIC_SITE_URL гейт счёл бы превью и промолчал; превью-литерал в шаге
      # делал ровно то же самое, только незаметнее. Боевая ветка доказывается
      # саботажем analytics-config-missing-id-on-prod.
      - name: analytics config (ID не литералом, боевой домен не пустым)
        run: npm run check:analytics-config

      # --- гейты Фазы 4 (/api/lead) ---------------------------------------
      # ⚠️ ПОРЯДОК ЗДЕСЬ — ЧАСТЬ ГЕЙТА, А НЕ ОФОРМЛЕНИЕ.
      #
      # check:secrets стоит ПОСЛЕ npm run build, потому что две его проверки из
      # трёх (B — литералы значений, C — формы секретов) читают dist/. Запущенный
      # до сборки, он не осмотрел бы ни одного файла. Молча зелёным он при этом
      # не станет: отсутствующий или пустой dist/ гейт считает ПАДЕНИЕМ (маркер
      # «СБОРКИ НЕТ»), а не «нечего проверять», — сертифицировать отсутствие
      # секрета в артефакте, которого нет, невозможно. Ресёрч фазы (§13.4)
      # предполагал разнести статическую и значенческую половины по двум
      # вызовам; реализация плана 04-03 сделала гейт ОДНОЙ командой, и
      # разносить нечего.
      - name: secrets (ни одного секрета в клиентском бандле)
        run: npm run check:secrets

      # Механическая разница между «Turnstile выключен по замыслу» и «забыли
      # включить». Гейт вооружается сам по боевому домену в PUBLIC_SITE_URL: на
      # превью предупреждает, на боевом домене с пустым sitekey валит сборку.
      # Домен и sitekey приходят из env ВСЕГО workflow (см. шапку файла) — тем
      # же способом, что у соседнего check:analytics-config, у которого
      # собственного блока env: нет вовсе. Урок Фазы 2.4 (гейт заглушек,
      # обезвреженный одной отсутствующей строкой env) закрыт именно так:
      # переменные объявлены в одном месте на оба гейта и совпадают с deploy.yml.
      - name: turnstile config (выключён по замыслу или забыт)
        run: npm run check:turnstile-config

      # Модульные сюиты на node:test: валидация, сообщение менеджеру, счётчик
      # частоты, клиент siteverify, журнал KV, доставка, порядок конвейера.
      # Ноль сети — fetch в каждой сюите подменён бросающей заглушкой.
      - name: lead unit suites (node:test)
        run: npm run check:lead-unit

      # Интеграционный драйвер: поднимает НАСТОЯЩИЙ рантайм Workers
      # (wrangler pages dev) с настоящим KV и настоящим caches.default и гоняет
      # 12 случаев. Окружение рантайма драйвер задаёт себе САМ флагами --binding
      # (фальшивый токен Telegram, тестовые ключи Turnstile, локальная заглушка
      # вместо api.telegram.org) — ни один боевой секрет этому шагу не
      # передаётся и передаваться не должен. Шаг стоит после сборки (ему нужен
      # dist/) и до Lighthouse: оба занимают порты, и разводит их только
      # последовательность шагов этого задания.
      - name: lead endpoint driver (настоящий рантайм Workers, порт 8788)
        env:
          # Не косметика: wrangler на первом запуске умеет спросить про
          # телеметрию, а раннер GitHub Actions не TTY. Шаг, ждущий ответа,
          # которого не будет, выглядит как зависший гейт и умирает по таймауту
          # задания через минуты.
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: npm run check:lead-endpoint

      # --- гейт Фазы 6 (воркер бота) ---------------------------------------
      # Интеграционный драйвер воркера: поднимает НАСТОЯЩИЙ рантайм Workers
      # (wrangler dev -c workers/bot/wrangler.jsonc, порт 8789) с настоящим KV и
      # гоняет случай 0 и 16 случаев конвейера против локальной заглушки Bot API.
      #
      # ⛔ БОЕВЫЕ СЕКРЕТЫ ЭТОМУ ШАГУ НЕ ПЕРЕДАЮТСЯ И ПЕРЕДАВАТЬСЯ НЕ ДОЛЖНЫ:
      # окружение рантайма драйвер задаёт себе САМ флагами `--var` (фальшивый
      # токен бота, фальшивые chat_id, локальная заглушка вместо
      # api.telegram.org). Их отсутствия в GitHub Actions — осознанное решение
      # проекта (docs/ops.md §3), и этот шаг на нём и построен: он идентичен на
      # машине разработчика и в облаке, потому что не зависит ни от одного
      # секрета репозитория. Случай 0 драйвера ДОКАЗЫВАЕТ, что до рантайма
      # доехали именно подставленные значения, а не какие-то другие.
      #
      # Шаг стоит после check:lead-endpoint и до саботажного стенда по той же
      # причине, по которой там стоит сосед: оба занимают порты (8788 и 8789), и
      # разводит их только последовательность шагов этого задания.
      - name: bot webhook driver (настоящий рантайм Workers, порт 8789)
        env:
          # Не косметика: wrangler на первом запуске умеет спросить про
          # телеметрию, а раннер GitHub Actions не TTY. Шаг, ждущий ответа,
          # которого не будет, выглядит как зависший гейт и умирает по таймауту
          # задания через минуты.
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: npm run check:bot-webhook

      # Саботажный стенд: ломает проверки нарочно и требует, чтобы каждая упала,
      # причём ПО СВОЕЙ причине. Он и есть страж от гейтов-ритуалов — в проекте
      # их было четыре штуки, все молча зелёные. Стенд восстанавливает рабочее
      # дерево сам и сверяет git status до и после.
      #
      # ⚠️ Здесь ПОЛНЫЙ режим (--with-costly), и это не роскошь. «По своей
      # причине» держится на подстроке, которую случай ждёт в выводе гейта, а
      # подстрока, которую гейт печатает и при УСПЕХЕ, не различает ничего:
      # случай, упавший по посторонней причине, был бы зачтён как доказавший
      # свою проверку. 2026-08-21 таких случаев в одном файле нашлось три из
      # шести. Теперь стенд сам сверяет каждую подстроку с выводом УСПЕШНОГО
      # прогона её гейта — но часть эталонов требует собранной dist/ или
      # поднятого рантайма Workers, и в обычном режиме они пропускаются, чтобы
      # `npm run check:sabotage` оставался дешёвым на машине разработчика.
      # В CI пропускать их незачем: шаг стоит ПОСЛЕ `npm run build` и после
      # шага lead-endpoint, освободившего порт 8788. Полный режим — надмножество
      # обычного, поэтому запускается один шаг, а не два.
      - name: sabotage stand (каждый гейт обязан уметь падать)
        env:
          # Нужны эталону check:lead-endpoint: он поднимает wrangler, а раннер
          # GitHub Actions не TTY — шаг, ждущий ответа про телеметрию, выглядит
          # как зависший гейт и умирает по таймауту задания.
          CI: 'true'
          WRANGLER_SEND_METRICS: 'false'
        run: npm run check:sabotage:full

      # --- e2e ------------------------------------------------------------
      # ⛔ 31.08.2026 — WEBKIT ДОБАВЛЕН, И ЭТО НЕ ПОЛНОТА РАДИ ПОЛНОТЫ.
      # Заказчик смотрит с айфона. Три круга подряд чинили анимацию
      # аккордеонов, которой в WebKit наполовину не существовало: условие
      # `@supports ... (interpolate-size: allow-keywords)`, на котором стоит
      # весь механизм, там ложно, и сворачивание шло ступенью (0 промежуточных
      # кадров, 90 % пути за 4 мс). Не поймал этого никто, потому что в
      # `playwright.config.ts` объявлен ровно один движок, а установка тянула
      # ровно один браузер.
      #
      # Стережёт находку `tests/webkit-motion.spec.ts` — он объявляет
      # `browserName: 'webkit'` пофайлово и без этой строки падал бы на
      # отсутствии браузера.
      #
      # ⚠️ ЦЕНА НАЗВАНА: +1 браузер к загрузке на каждый прогон CI (около
      # 90 МБ) и 4 теста сверх нынешних. Размен принят сознательно — три
      # потерянных круга стоили дороже.
      - name: install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright e2e
        id: playwright
        run: npx playwright test --workers=1

      # --- перфоманс -------------------------------------------------------
      # ⚠️ ЭТОГО ШАГА НЕ БЫЛО, при том что CLAUDE.md обещает «Lighthouse CI с
      # бюджетами — красный билд не деплоится в прод». Пороги LCP <= 2,5 с,
      # perf/a11y/bp >= 90 и seo >= 95 жили ТОЛЬКО в скрипте, который запускал
      # человек по памяти на своей машине; в автоматике перфоманс защищал
      # единственный байтовый бюджет одной локали. Регрессия скорости доехала
      # бы до прода зелёной. Нашла проверка Fable.
      #
      # Шаг идёт последним: он самый долгий (три локали), и падать раньше на
      # дешёвых проверках полезнее. Браузер уже установлен шагом выше, поэтому
      # отдельной установки не нужно — скрипт сам находит его в кэше Playwright.
      - name: Lighthouse mobile (пороги PERF-01, CMPL-02, SEO-05)
        run: npm run check:lighthouse

      # ⛔ ДО 08.09.2026 ЭТОТ ШАГ ВЫГРУЖАЛ ПУСТОТУ. Он забирал каталог
      # `playwright-report/`, которого репортёр `list` НЕ СОЗДАЁТ; параметр
      # `if-no-files-found` не был задан, поэтому шаг печатал предупреждение и
      # проходил зелёным. На красном CI команда получала НОЛЬ диагностики.
      # Починка из двух половин: в `playwright.config.ts` под CI добавлен
      # репортёр `html`, а сюда — второй путь `test-results/`, где лежат
      # трассы (`trace: retain-on-failure`) и кадры (`screenshot:
      # only-on-failure`).
      # ⛔ `if-no-files-found: error` обязателен: без него следующая такая же
      # потеря снова пройдёт молча, а молчащий шаг диагностики хуже, чем его
      # отсутствие, — он создаёт видимость, что артефакт есть.
      # ⛔ УСЛОВИЕ ПРИВЯЗАНО К ШАГУ ТЕСТОВ, А НЕ К `failure()` ВООБЩЕ — иначе
      # строгий `if-no-files-found: error` сам стал бы источником ложной
      # красноты. Большинство падений этого прогона случается РАНЬШЕ Playwright
      # (27 статических гейтов, сборка, юниты, стенд саботажа); тогда ни
      # `playwright-report/`, ни `test-results/` не существует, и шаг честно
      # падал бы на каждом таком прогоне, добавляя вторую красную строку к уже
      # красной причине.
      - name: upload Playwright report and traces on failure
        if: ${{ failure() && steps.playwright.conclusion == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 7
